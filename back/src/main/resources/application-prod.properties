# Production must fail at startup instead of silently using local defaults.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

verdict.admin.username=${VERDICT_ADMIN_USERNAME}
verdict.admin.password=${VERDICT_ADMIN_PASSWORD}
verdict.admin.allow-default-credentials=false
verdict.security.allowed-origins=${VERDICT_ALLOWED_ORIGINS}
verdict.security.require-https=true

server.forward-headers-strategy=framework
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
