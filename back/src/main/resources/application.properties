spring.application.name=brainhack

# Server
server.port=8080

# MySQL Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/verdict?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Frontend
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Admin (set from IntelliJ IDEA environment variables for real use)
verdict.admin.username=${VERDICT_ADMIN_USERNAME:admin}
verdict.admin.password=${VERDICT_ADMIN_PASSWORD:admin}

# LLM (optional; local deterministic fallback works without a key)
verdict.llm.api-key=${VERDICT_LLM_API_KEY:}
verdict.llm.model=${VERDICT_LLM_MODEL:gpt-4o-mini}
verdict.llm.temperature=${VERDICT_LLM_TEMPERATURE:0.2}
verdict.llm.url=${VERDICT_LLM_URL:https://api.openai.com/v1/chat/completions}

# RabbitMQ best-effort event publishing
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
verdict.rabbitmq.enabled=${VERDICT_RABBITMQ_ENABLED:false}
verdict.rabbitmq.exchange=${VERDICT_RABBITMQ_EXCHANGE:verdict.events}

# Audit limits
verdict.audit.max-claim-chars=${VERDICT_MAX_CLAIM_CHARS:12000}
verdict.audit.max-evidence-chars=${VERDICT_MAX_EVIDENCE_CHARS:20000}
verdict.audit.max-sentences=${VERDICT_MAX_SENTENCES:60}
