spring.application.name=brainhack
spring.config.import=optional:file:.env[.properties]

# Server
server.port=8080

# MySQL Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/verdict?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:${MYSQL_USER:}}
spring.datasource.password=${DB_PASSWORD:${MYSQL_PASSWORD:}}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Frontend
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**
spring.servlet.multipart.max-file-size=${VERDICT_MAX_UPLOAD_SIZE:8MB}
spring.servlet.multipart.max-request-size=${VERDICT_MAX_REQUEST_SIZE:9MB}

# Admin (set from IntelliJ IDEA environment variables for real use)
verdict.admin.username=${VERDICT_ADMIN_USERNAME:admin}
verdict.admin.password=${VERDICT_ADMIN_PASSWORD:admin}
verdict.admin.allow-default-credentials=${VERDICT_ALLOW_DEFAULT_ADMIN:false}

# API docs
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/docs/ui

# Security
verdict.security.allowed-origins=${VERDICT_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
verdict.security.require-https=${VERDICT_REQUIRE_HTTPS:false}
verdict.rate-limit.enabled=${VERDICT_RATE_LIMIT_ENABLED:true}
verdict.rate-limit.window-seconds=${VERDICT_RATE_LIMIT_WINDOW_SECONDS:60}
verdict.rate-limit.auth-requests=${VERDICT_RATE_LIMIT_AUTH_REQUESTS:10}
verdict.rate-limit.audit-requests=${VERDICT_RATE_LIMIT_AUDIT_REQUESTS:20}
verdict.rate-limit.admin-requests=${VERDICT_RATE_LIMIT_ADMIN_REQUESTS:60}

# LLM (optional; local deterministic fallback works without a key)
verdict.llm.api-key=${VERDICT_LLM_API_KEY:}
verdict.llm.model=${VERDICT_LLM_MODEL:gpt-4o-mini}
verdict.llm.temperature=${VERDICT_LLM_TEMPERATURE:0.2}
verdict.llm.url=${VERDICT_LLM_URL:https://api.openai.com/v1/chat/completions}
verdict.llm.timeout-seconds=${VERDICT_LLM_TIMEOUT_SECONDS:20}
verdict.llm.max-attempts=${VERDICT_LLM_MAX_ATTEMPTS:3}
verdict.llm.backoff-millis=${VERDICT_LLM_BACKOFF_MILLIS:500}
verdict.llm.input-cost-per-million=${VERDICT_LLM_INPUT_COST_PER_MILLION:0.15}
verdict.llm.output-cost-per-million=${VERDICT_LLM_OUTPUT_COST_PER_MILLION:0.60}
verdict.github.token=${GITHUB_TOKEN:}

# RabbitMQ best-effort event publishing
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
verdict.rabbitmq.enabled=${VERDICT_RABBITMQ_ENABLED:false}
verdict.rabbitmq.exchange=${VERDICT_RABBITMQ_EXCHANGE:verdict.events}
verdict.audit.rabbitmq.enabled=${VERDICT_AUDIT_RABBITMQ_ENABLED:false}
verdict.audit.rabbitmq.exchange=${VERDICT_AUDIT_RABBITMQ_EXCHANGE:verdict.audit.jobs}
verdict.audit.rabbitmq.queue=${VERDICT_AUDIT_RABBITMQ_QUEUE:verdict.audit.jobs}
verdict.audit.rabbitmq.routing-key=${VERDICT_AUDIT_RABBITMQ_ROUTING_KEY:audit.job.requested}

# Audit limits
verdict.audit.max-claim-chars=${VERDICT_MAX_CLAIM_CHARS:12000}
verdict.audit.max-evidence-chars=${VERDICT_MAX_EVIDENCE_CHARS:20000}
verdict.audit.max-sentences=${VERDICT_MAX_SENTENCES:60}

# Local message audit log
verdict.messages.log-file=${VERDICT_MESSAGES_LOG_FILE:logs/messages.txt}
