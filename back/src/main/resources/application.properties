spring.application.name=brainhack

# Server
server.port=8080

# H2 Database (embedded, file-based)
spring.datasource.url=jdbc:h2:file:./data/verdictdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Frontend
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# LLM API Key (set on hackathon day)
# verdict.llm.api-key=
# verdict.llm.model=gpt-4o-mini
# verdict.llm.temperature=0.2
