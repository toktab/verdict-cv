spring.datasource.url=jdbc:h2:mem:verdict-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.rabbitmq.listener.simple.auto-startup=false
verdict.rabbitmq.enabled=false
verdict.rabbitmq.exchange=verdict.events
verdict.audit.rabbitmq.enabled=false
verdict.audit.rabbitmq.exchange=verdict.audit.jobs
verdict.audit.rabbitmq.queue=verdict.audit.jobs
verdict.audit.rabbitmq.routing-key=audit.job.requested
verdict.admin.username=admin
verdict.admin.password=admin
verdict.admin.allow-default-credentials=true
verdict.rate-limit.enabled=false
verdict.audit.max-claim-chars=12000
verdict.audit.max-evidence-chars=20000
verdict.audit.max-sentences=60
verdict.messages.log-file=target/test-message-log.txt
verdict.llm.api-key=
verdict.llm.model=gpt-4o-mini
verdict.llm.temperature=0.2
verdict.llm.url=https://api.openai.com/v1/chat/completions
verdict.llm.timeout-seconds=20
verdict.llm.max-attempts=3
verdict.llm.backoff-millis=500
verdict.llm.input-cost-per-million=0.15
verdict.llm.output-cost-per-million=0.60
