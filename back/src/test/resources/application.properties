spring.datasource.url=jdbc:h2:mem:verdict-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.rabbitmq.listener.simple.auto-startup=false
verdict.rabbitmq.enabled=false
verdict.rabbitmq.exchange=verdict.events
verdict.admin.username=admin
verdict.admin.password=admin
verdict.audit.max-claim-chars=12000
verdict.audit.max-evidence-chars=20000
verdict.audit.max-sentences=60
verdict.llm.api-key=
verdict.llm.model=gpt-4o-mini
verdict.llm.temperature=0.2
verdict.llm.url=https://api.openai.com/v1/chat/completions
